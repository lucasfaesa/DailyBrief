name: Daily News Digest

# GitHub's own `schedule:` ran 3-7h late on this repo; cron-job.org calls the
# workflow_dispatch API at 07:07 and 21:07 America/Sao_Paulo instead (see wiki/architecture/workflow.md)
on:
  workflow_dispatch:

permissions:
  contents: write

# A second dispatch during a running one would race it on git push
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 50  # Reddit pacing (~1 min per subreddit) + 12 min LLM budget (PIPELINE_BUDGET_SECONDS)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news digest pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main.py

      - name: Commit and push generated docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit when changes are staged
          git diff --cached --quiet || git commit -m "chore: daily digest $(TZ=America/Sao_Paulo date +'%Y-%m-%d')"
          # Commits pushed while the pipeline ran would otherwise reject this push and lose the edition
          git pull --rebase
          git push
