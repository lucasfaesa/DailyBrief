<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111214" />
  <meta name="description" content="AI-generated daily news digest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DailyBrief" />

  <title>DailyBrief</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preload" href="data.json" as="fetch" crossorigin />
</head>
<body>

  <header id="app-header">
    <div class="header-inner">
      <a href="#" class="brand" onclick="App.selectTheme('all')">
        <span class="brand-name">Daily<em>Brief</em></span>
        <span id="generated-at" class="generated-at"></span>
      </a>
      <div class="header-actions">
        <button id="btn-install" class="btn-icon hidden" title="Install app" aria-label="Install app">⤓</button>
        <button id="btn-archive" class="btn-icon" title="Previous editions" aria-label="Previous editions">Archive</button>
      </div>
    </div>
    <nav id="theme-tabs" class="theme-tabs" role="tablist" aria-label="Themes"></nav>
  </header>

  <main id="app-main">

    <div id="loading" class="loading-screen" aria-live="polite">
      <div class="spinner"></div>
      <p>Loading news…</p>
    </div>

    <div id="error-screen" class="hidden error-screen" role="alert">
      <p id="error-msg">Could not load the news.</p>
      <button onclick="App.loadData()" class="btn-primary">Try again</button>
    </div>

    <div id="home-view" class="hidden"></div>

    <div id="detail-view" class="hidden detail-view" role="region" aria-label="News details">
      <button class="btn-back" onclick="App.goHome()">← Back</button>
      <article id="detail-content"></article>
    </div>

    <div id="archive-view" class="hidden archive-view" role="region" aria-label="Archive">
      <button class="btn-back" onclick="App.goHome()">← Back</button>
      <h2 class="page-title">Previous editions</h2>
      <div id="archive-list" class="archive-list"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
