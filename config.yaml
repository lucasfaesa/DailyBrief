# =============================================================
# DailyBrief – config.yaml
# Main configuration settings for the news digest pipeline
# =============================================================

# ── Collection ───────────────────────────────────────────────
collection:
  lookback_hours: 24          # Window of time considered "today's news"
  max_items_per_source: 30    # Maximum items per source before deduplication
  max_high_relevance: 30      # Maximum high-relevance items (relevance >= 4) for full summaries
  relevance_threshold: 4      # Minimum relevance score to trigger full article summary

# ── Hacker News ──────────────────────────────────────────────
hacker_news:
  enabled: true
  top_stories_limit: 30       # Top stories to inspect
  max_comments: 30            # Maximum comments per post

# ── Reddit ───────────────────────────────────────────────────
reddit:
  enabled: true
  user_agent: "DailyBrief/1.0 (automated news digest; contact via GitHub)"
  max_comments: 30
  subreddits:
    - name: worldnews
      flair_filter: null
    - name: technology
      flair_filter: null
    - name: artificial
      flair_filter: null
    - name: gaming
      flair_filter: null
    - name: anime
      flair_filter: null
    - name: science
      flair_filter: null
    - name: news
      flair_filter: null
    - name: programming
      flair_filter: null

# ── RSS Feeds ────────────────────────────────────────────────
rss_feeds:
  - name: "BBC News"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    category_hint: "international_politics"

  - name: "Reuters Top News"
    url: "https://feeds.reuters.com/reuters/topNews"
    category_hint: "international_politics"

  - name: "Reuters Technology"
    url: "https://feeds.reuters.com/reuters/technologyNews"
    category_hint: "technology"

  - name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
    category_hint: "technology"

  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
    category_hint: "technology"

  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/index"
    category_hint: "technology"

  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
    category_hint: "ai"

  - name: "Nature News"
    url: "https://www.nature.com/nature.rss"
    category_hint: "science"

  - name: "CNBC Top News"
    url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
    category_hint: "economy"

# ── Text Extraction ──────────────────────────────────────────
extraction:
  max_chars: 6000             # Body character limit
  timeout_seconds: 15         # HTTP request timeout

# ── LLM Layer ────────────────────────────────────────────────
llm:
  rate_limit_pause_seconds: 1.5   # Delay between LLM invocations
  max_retries_per_provider: 2     # Attempts before switching providers
  json_fix_retries: 2             # Attempts to repair invalid JSON
  backoff_base_seconds: 2         # Exponential backoff base in seconds

  providers:
    - name: "gemini"
      model: "gemini-2.0-flash"
      env_key: "GEMINI_API_KEY"

    - name: "groq"
      model: "llama-3.3-70b-versatile"
      env_key: "GROQ_API_KEY"

# ── Allowed Themes ───────────────────────────────────────────
themes:
  - national_politics
  - international_politics
  - technology
  - ai
  - gaming
  - anime
  - science
  - economy
  - others

# ── Site Config ──────────────────────────────────────────────
site:
  title: "DailyBrief"
  description: "Automated AI-powered daily news digest"
  timezone: "America/Sao_Paulo"
