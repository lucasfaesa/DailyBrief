# ── Text Extraction ──────────────────────────────────────────
extraction:
  max_chars: 6000             # Body character limit
  timeout_seconds: 15         # HTTP request timeout

# ── LLM Layer ────────────────────────────────────────────────
llm:
  rate_limit_pause_seconds: 6     # Delay between LLM invocations (Gemini free tier ≈ 10 RPM)
  max_retries_per_provider: 3     # Attempts before switching providers
  json_fix_retries: 2             # Attempts to repair invalid JSON
  backoff_base_seconds: 4         # Exponential backoff base in seconds

  providers:
    - name: "gemini"
      model: "gemini-flash-lite-latest"   # first: ~5s per batch; Flash took 30s-3min and its free quota ran out after 5 calls
      env_key: "GEMINI_API_KEY"

    - name: "gemini"
      model: "gemini-flash-latest"   # alias tracks the current Flash; separate capacity pool
      env_key: "GEMINI_API_KEY"

    - name: "groq"
      model: "openai/gpt-oss-120b"   # llama-3.3-70b-versatile was removed
      env_key: "GROQ_API_KEY"

# ── Allowed Themes ───────────────────────────────────────────
themes:
  - national_politics
  - international_politics
  - technology
  - ai
  - gaming
  - game_dev
  - custom_engines
  - movies
  - crypto
  - anime
  - science
  - economy
  - concursos
  - others

# ── Site Config ──────────────────────────────────────────────
site:
  title: "DailyBrief"
  description: "Automated AI-powered daily news digest"
  timezone: "America/Sao_Paulo"
